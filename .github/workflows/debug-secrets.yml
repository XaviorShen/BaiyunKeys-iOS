name: Debug Secrets Fingerprint

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - name: CI 内直接查询 App Store Connect
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
          P8B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          pip install pyjwt --quiet
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          import jwt

          key = base64.b64decode(os.environ["P8B64"])
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ISSUER"], "iat": now, "exp": now + 1200,
               "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["KEYID"]})

          def api(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} on {path}")
                  print(e.read().decode(errors="replace")[:1500])
                  return None

          apps = api("/v1/apps")
          if apps:
              print("== Apps ==")
              for a in apps.get("data", []):
                  at = a["attributes"]
                  print(f"  App: {at.get('name')} | bundleId: {at.get('bundleId')}")

          builds = api("/v1/builds?limit=10&sort=-uploadedDate")
          if builds:
              print("== Builds ==")
              if not builds.get("data"):
                  print("  (none)")
              for b in builds.get("data", []):
                  at = b["attributes"]
                  print(f"  version {at.get('version')} | state: {at.get('processingState')} | uploaded: {at.get('uploadedDate')}")
          PY
