name: Debug Secrets Fingerprint

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 轮询等待新构建入库
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
          P8B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          pip install pyjwt --quiet
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          import jwt

          key = base64.b64decode(os.environ["P8B64"])
          deadline = time.time() + 19 * 60

          def token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": os.environ["ISSUER"], "iat": now, "exp": now + 1200,
                   "aud": "appstoreconnect-v1"},
                  key, algorithm="ES256", headers={"kid": os.environ["KEYID"]})

          def api(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           headers={"Authorization": "Bearer " + token()})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"  HTTP {e.code}: {e.read().decode(errors='replace')[:400]}")
                  return None

          attempt = 0
          while time.time() < deadline:
              attempt += 1
              builds = api("/v1/builds?limit=10&sort=-uploadedDate")
              fresh = []
              if builds:
                  for b in builds.get("data", []):
                      at = b["attributes"]
                      up = at.get("uploadedDate") or ""
                      if up.startswith("2026-11-09T1") or up.startswith("2026-11-09T2") or at.get("version") == "45":
                          fresh.append((at.get("version"), at.get("processingState"), up))
              print(f"[attempt {attempt}] fresh/today builds: {fresh if fresh else 'none yet'}", flush=True)
              if fresh:
                  for v, st, up in fresh:
                      print(f"  BUILD FOUND -> version {v} | state: {st} | uploaded: {up}", flush=True)
                  break
              time.sleep(60)
          else:
              print("TIMEOUT: build not visible after 19 minutes", flush=True)
          PY
