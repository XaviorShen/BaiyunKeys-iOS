name: Debug Secrets Fingerprint

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - name: 查询 bundle id 注册与团队信息
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
          P8B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          pip install pyjwt --quiet
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          import jwt

          key = base64.b64decode(os.environ["P8B64"])
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ISSUER"], "iat": now, "exp": now + 1200,
               "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["KEYID"]})

          def api(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} on {path}: {e.read().decode(errors='replace')[:800]}")
                  return None

          print("== bundleIds: com.xavior.baiyunkey 注册在哪个团队 ==")
          r = api("/v1/bundleIds?filter[identifier]=com.xavior.baiyunkey")
          if r is not None:
              if r.get("data"):
                  for b in r["data"]:
                      print("  FOUND:", b["id"], b["attributes"])
              else:
                  print("  NOT FOUND in this API key's team")

          print("== 全部注册的 bundleIds(找 xavior/baiyun) ==")
          r = api("/v1/bundleIds?limit=200")
          if r is not None:
              for b in r.get("data", []):
                  ident = (b["attributes"].get("identifier") or "").lower()
                  if "xavior" in ident or "baiyun" in ident:
                      print("  MATCH:", b["attributes"].get("identifier"))
              print(f"  (team bundle id total: {len(r.get('data', []))})")
          PY
