name: Debug Secrets Fingerprint

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - name: 打印密钥指纹
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
          P8B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          echo "issuer : len=${#ISSUER} first6=${ISSUER:0:6} last4=${ISSUER: -4} fp=$(printf '%s' "$ISSUER" | sha256sum | cut -c1-16)"
          echo "keyid  : len=${#KEYID} value=$KEYID"
          echo "p8     : b64len=${#P8B64} fp=$(printf '%s' "$P8B64" | base64 -d | sha256sum | cut -c1-16)"
